name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          DATABASE_URL: mysql://memoria:memoria@localhost:3306/memoria
          SESSION_SECRET: ci-session-secret
          NEXT_PUBLIC_API_URL: http://localhost:4000
